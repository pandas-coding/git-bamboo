name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All third-party actions are pinned to full commit SHAs (tags are mutable).
# To update: resolve the new SHA, verify the repo, and replace.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Tests create real commits; CI runners have no git identity.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Test
        run: cargo test --workspace --locked --verbose

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # The action reports results as a Check Run via the REST API.
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
