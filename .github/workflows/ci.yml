name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      - name: Test
        run: cargo test --workspace --verbose
      - name: Build Release
        run: cargo build --release --verbose

  package:
    name: Package VSIX
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            vscode_target: darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Engine
        run: cargo build --release --target ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Copy Binary
        shell: bash
        run: |
          mkdir -p vscode-extension/server
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/git-workbench-engine.exe vscode-extension/server/git-workbench-engine.exe
          else
            cp target/${{ matrix.target }}/release/git-workbench-engine vscode-extension/server/git-workbench-engine
          fi
      - name: Package Extension
        working-directory: vscode-extension
        run: vsce package --target ${{ matrix.vscode_target }}
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: git-workbench-${{ matrix.vscode_target }}.vsix
          path: vscode-extension/*.vsix
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: git-workbench-engine-${{ matrix.vscode_target }}
          path: |
            vscode-extension/server/git-workbench-engine*
