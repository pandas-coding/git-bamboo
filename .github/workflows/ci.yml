name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All third-party actions are pinned to full commit SHAs (tags are mutable).
# To update: resolve the new SHA, verify the repo, and replace.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Tests create real commits; CI runners have no git identity.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Test
        run: cargo test --workspace --locked --verbose

  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    # The action reports results as a Check Run via the REST API.
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package VSIX
    needs: [rust-test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            vscode_target: darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Engine
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install Extension Dependencies
        # Pinned @vscode/vsce from package-lock.json — no global installs.
        working-directory: vscode-extension
        run: npm ci
      - name: Copy Binary
        shell: bash
        run: |
          mkdir -p vscode-extension/server
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/git-workbench-engine.exe vscode-extension/server/git-workbench-engine.exe
          else
            cp target/${{ matrix.target }}/release/git-workbench-engine vscode-extension/server/git-workbench-engine
          fi
      - name: Package Extension
        working-directory: vscode-extension
        run: npx vsce package --target ${{ matrix.vscode_target }}
      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-workbench-${{ matrix.vscode_target }}.vsix
          path: vscode-extension/*.vsix
