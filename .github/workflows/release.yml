name: Release

# Packages platform-specific VSIX bundles. Triggered by version tags
# (e.g. v0.1.0) so everyday pushes to main do not pay the packaging cost.
# The tag is published as a GitHub Release with the VSIX files attached.
#
# Visual Studio Marketplace publishing is manual. Automated publish needs
# an Entra tenant (or an Azure account to create one); this repo does not
# have one. After the Release succeeds, download the three VSIX assets and
# upload each on https://marketplace.visualstudio.com/manage — the version
# comes from editors/vscode/package.json, and must increase every publish.
# Users can also install a platform VSIX directly from the Release.
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package VSIX (${{ matrix.vscode_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            vscode_target: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Engine
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Extension Dependencies
        # Pinned @vscode/vsce from package-lock.json — no global installs.
        working-directory: editors/vscode
        run: npm ci
      - name: Build Extension
        working-directory: editors/vscode
        run: npm run build
      - name: Copy Binary
        shell: bash
        run: |
          mkdir -p editors/vscode/server
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/bamboo-engine.exe editors/vscode/server/bamboo-engine.exe
          else
            cp target/${{ matrix.target }}/release/bamboo-engine editors/vscode/server/bamboo-engine
          fi
      - name: Package Extension
        working-directory: editors/vscode
        run: npx vsce package --target ${{ matrix.vscode_target }}
      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-bamboo-${{ matrix.vscode_target }}.vsix
          path: editors/vscode/*.vsix

  github-release:
    name: GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifacts
        # gh is preinstalled on GitHub-hosted runners and authenticates with
        # GITHUB_TOKEN, so no third-party download action (and no extra
        # pinned SHA) is needed. Each artifact unpacks into dist/<artifact>/.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --dir dist
          find dist -name '*.vsix' -print
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*/*.vsix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no VSIX artifacts found" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$GITHUB_REF_NAME" \
            --generate-release-notes
          echo "Marketplace publish is manual: upload these VSIX files at"
          echo "https://marketplace.visualstudio.com/manage"
