<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Replaced at runtime by the extension host with a CSP pinned to this webview. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Bamboo — Commit</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      display: flex;
      flex-direction: column;
    }
    /* Commit message area */
    #message-area {
      padding: 8px 12px;
      border-bottom: 1px solid var(--vscode-panel-border, transparent);
      flex-shrink: 0;
    }
    #commit-message {
      width: 100%;
      min-height: 56px;
      max-height: 200px;
      resize: vertical;
      box-sizing: border-box;
      padding: 6px 8px;
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-input-foreground);
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 3px;
      outline: none;
    }
    #commit-message::placeholder {
      color: var(--vscode-input-placeholderForeground);
    }
    #commit-message:focus {
      border-color: var(--vscode-focusBorder);
    }
    /* File list */
    #file-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 8px;
    }
    .section {
      margin-top: 4px;
    }
    .section-header {
      display: flex;
      align-items: center;
      padding: 4px 12px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--vscode-foreground);
    }
    .section-header:hover {
      background: var(--vscode-list-hoverBackground);
    }
    .section-header .arrow {
      margin-right: 4px;
      font-size: 10px;
      transition: transform 0.1s;
      display: inline-block;
      width: 12px;
      text-align: center;
    }
    .section-header.collapsed .arrow {
      transform: rotate(-90deg);
    }
    .section-header .count {
      margin-left: 6px;
      padding: 0 5px;
      border-radius: 8px;
      background: var(--vscode-badge-background);
      color: var(--vscode-badge-foreground);
      font-size: 10px;
      line-height: 14px;
      min-width: 14px;
      text-align: center;
    }
    .file-row {
      display: flex;
      align-items: center;
      padding: 3px 12px 3px 28px;
      cursor: pointer;
      height: 22px;
      box-sizing: border-box;
    }
    .file-row:hover {
      background: var(--vscode-list-hoverBackground);
    }
    .file-row .status-badge {
      flex: 0 0 auto;
      width: 16px;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      margin-right: 6px;
      border-radius: 2px;
      line-height: 14px;
    }
    .status-badge.added, .status-badge.untracked {
      color: var(--vscode-gitDecoration-addedResourceForeground, #73c991);
    }
    .status-badge.modified, .status-badge.renamed, .status-badge.copied {
      color: var(--vscode-gitDecoration-modifiedResourceForeground, #e2c08d);
    }
    .status-badge.deleted {
      color: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39);
    }
    .status-badge.conflict {
      color: var(--vscode-gitDecoration-conflictingResourceForeground, #e4676b);
    }
    .file-row .filename {
      flex: 0 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-row .dirname {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--vscode-descriptionForeground);
      margin-left: 4px;
      padding-left: 4px;
    }
    .file-row .actions {
      flex: 0 0 auto;
      display: none;
      gap: 2px;
      margin-left: 4px;
    }
    .file-row:hover .actions {
      display: flex;
    }
    .file-row .action-btn {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--vscode-foreground);
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .file-row .action-btn:hover {
      background: var(--vscode-toolbar-hoverBackground);
    }
    /* Section-header bulk action (Stage All / Unstage All): same visual
       language as the row buttons, right-aligned in the header and revealed
       on header hover. Clicks must not toggle the section's collapse (the
       handlers stopPropagation), and an empty section disables the button. */
    .section-header .action-btn {
      margin-left: auto;
      width: 18px;
      height: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--vscode-foreground);
      cursor: pointer;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .section-header:hover .action-btn {
      display: flex;
    }
    .section-header .action-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .section-header .action-btn:not(:disabled):hover {
      background: var(--vscode-toolbar-hoverBackground);
    }
    /* Bottom bar */
    #bottom-bar {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-top: 1px solid var(--vscode-panel-border, transparent);
      gap: 8px;
      flex-shrink: 0;
    }
    #bottom-bar .btn {
      padding: 4px 12px;
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size, 13px);
      border: 1px solid var(--vscode-button-border, transparent);
      border-radius: 2px;
      cursor: pointer;
    }
    #btn-commit {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
    }
    #btn-commit:hover {
      background: var(--vscode-button-hoverBackground);
    }
    #btn-amend {
      background: var(--vscode-button-secondaryBackground, var(--vscode-button-background));
      color: var(--vscode-button-secondaryForeground, var(--vscode-button-foreground));
    }
    #btn-amend:hover {
      background: var(--vscode-button-secondaryHoverBackground, var(--vscode-button-hoverBackground));
    }
    #stats {
      margin-left: auto;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
    }
    /* Empty state */
    #empty-state {
      display: none;
      padding: 24px 12px;
      text-align: center;
      color: var(--vscode-descriptionForeground);
      font-style: italic;
    }
    #empty-state.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="message-area">
    <textarea id="commit-message" placeholder="Commit message (Ctrl+Enter to commit)"></textarea>
  </div>
  <div id="file-list">
    <div id="empty-state" class="visible">No changes</div>
    <div id="staged-section" class="section" style="display:none;">
      <div class="section-header" data-section="staged">
        <span class="arrow">▾</span>
        <span>Staged</span>
        <span class="count" id="staged-count">0</span>
        <button id="staged-bulk" class="action-btn" title="Unstage All Changes">−</button>
      </div>
      <div class="section-body" id="staged-body"></div>
    </div>
    <div id="changes-section" class="section" style="display:none;">
      <div class="section-header" data-section="changes">
        <span class="arrow">▾</span>
        <span>Changes</span>
        <span class="count" id="changes-count">0</span>
        <button id="changes-bulk" class="action-btn" title="Stage All Changes">+</button>
      </div>
      <div class="section-body" id="changes-body"></div>
    </div>
    <div id="untracked-section" class="section" style="display:none;">
      <div class="section-header" data-section="untracked">
        <span class="arrow">▾</span>
        <span>Untracked</span>
        <span class="count" id="untracked-count">0</span>
        <button id="untracked-bulk" class="action-btn" title="Stage All Untracked Files">+</button>
      </div>
      <div class="section-body" id="untracked-body"></div>
    </div>
  </div>
  <div id="bottom-bar">
    <button id="btn-commit" class="btn">Commit</button>
    <button id="btn-amend" class="btn">Amend</button>
    <span id="stats"></span>
  </div>
  <script type="module" src="./commit.js"></script>
</body>
</html>
