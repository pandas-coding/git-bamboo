<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Replaced at runtime by the extension host with a CSP pinned to this webview. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Bamboo — Commit Graph</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
    }
    #container {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    #scroller {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* Defines the full virtual scroll height (total_approx * ROW_HEIGHT). */
    #spacer {
      width: 1px;
      pointer-events: none;
    }
    #rows {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }
    .row {
      position: absolute;
      left: 0;
      right: 12px;
      height: 24px;
      line-height: 24px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      box-sizing: border-box;
    }
    /* Left gutter where the canvas branch curves live. Width follows the
     * visible lane count (JS sets the --graph-width variable). */
    .row .graph-gap {
      flex: 0 0 var(--graph-width, 240px);
    }
    .row .message {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
    }
    /* Branch-tip tags rendered next to commits that refs point at. */
    .row .branch-tags {
      flex: 0 0 auto;
      margin-left: 8px;
      display: flex;
      gap: 4px;
      overflow: hidden;
    }
    .row .branch-tag {
      flex: 0 0 auto;
      padding: 0 5px;
      height: 16px;
      line-height: 16px;
      border: 1px solid;
      border-radius: 4px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      background: var(--vscode-editorWidget-background, transparent);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    /* Tag pill: tag icon + colored border (set from JS per name). */
    .row .branch-tag .tag-icon {
      width: 11px;
      height: 11px;
      fill: currentColor;
      flex: 0 0 auto;
    }
    /* Remote-tracking branch pill: italic, visually de-emphasized. */
    .row .branch-tag.remote-pill {
      font-style: italic;
      border-color: var(--vscode-descriptionForeground);
    }
    /* HEAD marker: bold pill with an accent border, plus a subtle row edge. */
    .row .head-pill {
      flex: 0 0 auto;
      padding: 0 5px;
      height: 16px;
      line-height: 16px;
      border: 1px solid var(--vscode-focusBorder, #007fd4);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--vscode-badge-foreground, var(--vscode-foreground));
      background: var(--vscode-badge-background, transparent);
      box-sizing: border-box;
    }
    .row.head-row {
      box-shadow: inset 2px 0 0 var(--vscode-focusBorder, #007fd4);
    }
    .row .meta {
      flex: 0 0 auto;
      margin-left: 16px;
      padding-left: 16px;
      color: var(--vscode-descriptionForeground);
    }
    .row .meta .author {
      margin-right: 8px;
    }
    .row:hover {
      background: var(--vscode-list-hoverBackground);
    }
    .row.selected {
      background: var(--vscode-list-activeSelectionBackground);
      color: var(--vscode-list-activeSelectionForeground);
    }
    /* Drag handle at the lane-area / message-column boundary. The visible
     * bar is 4px; the hit area is 10px (centered on the boundary) so it is
     * easy to grab. Position/width track the --graph-width variable. */
    #splitter {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--graph-width, 240px);
      width: 10px;
      transform: translateX(-5px);
      cursor: col-resize;
      z-index: 10;
      background: transparent;
      outline: none;
    }
    #splitter::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 4px;
      background: transparent;
    }
    #splitter:hover::after,
    #splitter:focus-visible::after,
    #splitter.dragging::after {
      background: var(--vscode-focusBorder, #007fd4);
    }
    /* Canvas overlay sits above the rows (branch curves), never intercepts input. */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--graph-width, 240px);
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="scroller">
      <div id="spacer"></div>
      <div id="rows"></div>
    </div>
    <canvas id="overlay"></canvas>
    <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Commit graph lane area width" tabindex="0"></div>
  </div>
  <script type="module" src="./graph.js"></script>
</body>
</html>
