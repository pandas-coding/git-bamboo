<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Replaced at runtime by the extension host with a CSP pinned to this webview. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Bamboo — Commit Graph</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
    }
    #container {
      position: relative;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Network operations row at the top of the graph: fetch / pull /
     * push / sync buttons plus the ahead/behind badge pill. */
    #toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 2px;
      height: 30px;
      padding: 0 6px;
      box-sizing: border-box;
      border-bottom: 1px solid var(--vscode-panelSection-border, transparent);
    }
    .net-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 24px;
      padding: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--vscode-icon-foreground, var(--vscode-foreground));
      cursor: pointer;
      box-sizing: border-box;
    }
    .net-btn:hover:not(:disabled) {
      background: var(--vscode-toolbar-hoverBackground);
    }
    .net-btn:focus-visible {
      outline: 1px solid var(--vscode-focusBorder, #007fd4);
      outline-offset: -1px;
    }
    .net-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .net-btn svg {
      display: block;
    }
    /* The running operation's button spins; the whole row is disabled
     * meanwhile (netOpState from the host). */
    @keyframes net-spin {
      to { transform: rotate(360deg); }
    }
    .net-btn.busy svg {
      animation: net-spin 0.9s linear infinite;
    }
    /* Ahead/behind badge pill (branch-tag style genes). Clickable only in
     * the unpublished (↑✱) state, where it enters the publish flow. */
    #ahead-behind {
      display: inline-flex;
      align-items: center;
      margin-left: 8px;
      padding: 0 6px;
      height: 17px;
      border: 1px solid var(--vscode-descriptionForeground);
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      color: var(--vscode-descriptionForeground);
      background: var(--vscode-editorWidget-background, transparent);
      box-sizing: border-box;
      white-space: nowrap;
      cursor: default;
    }
    #ahead-behind:not(:disabled) {
      color: var(--vscode-foreground);
      cursor: pointer;
    }
    #ahead-behind:not(:disabled):hover,
    #ahead-behind:not(:disabled):focus-visible {
      border-color: var(--vscode-focusBorder, #007fd4);
      outline: none;
    }
    #ahead-behind:disabled {
      opacity: 0.7;
    }
    /* Scroller + overlay + splitter live in one relative block below the
     * toolbar (they all position against it). */
    #graph-area {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    #scroller {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
    }
    /* Defines the full virtual scroll height (total_approx * ROW_HEIGHT). */
    #spacer {
      width: 1px;
      pointer-events: none;
    }
    #rows {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }
    .row {
      position: absolute;
      left: 0;
      right: 12px;
      height: 24px;
      line-height: 24px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
      box-sizing: border-box;
    }
    /* Left gutter where the canvas branch curves live. Width follows the
     * visible lane count (JS sets the --graph-width variable). */
    .row .graph-gap {
      flex: 0 0 var(--graph-width, 240px);
    }
    .row .message {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 auto;
    }
    /* Branch-tip tags rendered next to commits that refs point at. */
    .row .branch-tags {
      flex: 0 0 auto;
      margin-left: 8px;
      display: flex;
      gap: 4px;
      overflow: hidden;
    }
    .row .branch-tag {
      flex: 0 0 auto;
      padding: 0 5px;
      height: 16px;
      line-height: 16px;
      border: 1px solid;
      border-radius: 4px;
      font-size: 11px;
      color: var(--vscode-descriptionForeground);
      background: var(--vscode-editorWidget-background, transparent);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    /* Tag icon inside branch pills: tag pills carry this icon plus a
     * per-name border color set from JS (no dedicated class needed). */
    .row .branch-tag .tag-icon {
      width: 11px;
      height: 11px;
      fill: currentColor;
      flex: 0 0 auto;
    }
    /* Remote-tracking branch pill: italic, visually de-emphasized. */
    .row .branch-tag.remote-pill {
      font-style: italic;
      border-color: var(--vscode-descriptionForeground);
    }
    /* HEAD marker: bold pill with an accent border, plus a subtle row edge. */
    .row .head-pill {
      flex: 0 0 auto;
      padding: 0 5px;
      height: 16px;
      line-height: 16px;
      border: 1px solid var(--vscode-focusBorder, #007fd4);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--vscode-badge-foreground, var(--vscode-foreground));
      background: var(--vscode-badge-background, transparent);
      box-sizing: border-box;
    }
    .row.head-row {
      box-shadow: inset 2px 0 0 var(--vscode-focusBorder, #007fd4);
    }
    .row .meta {
      flex: 0 0 auto;
      margin-left: 16px;
      padding-left: 16px;
      color: var(--vscode-descriptionForeground);
      display: flex;
      gap: 8px;
    }
    /* Fixed-shape author + time columns so the time column's right edge
     * lines up across rows; long authors ellipsize. */
    .row .meta .author {
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 14ch;
    }
    .row .meta .time {
      flex: 0 0 auto;
      text-align: right;
    }
    .row:hover {
      background: var(--vscode-list-hoverBackground);
    }
    .row.selected {
      background: var(--vscode-list-activeSelectionBackground);
      color: var(--vscode-list-activeSelectionForeground);
    }
    /* Drag handle at the lane-area / message-column boundary. The visible
     * bar is 4px; the hit area is 10px (centered on the boundary) so it is
     * easy to grab. Position/width track the --graph-width variable. */
    #splitter {
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--graph-width, 240px);
      width: 10px;
      transform: translateX(-5px);
      cursor: col-resize;
      z-index: 10;
      background: transparent;
      outline: none;
    }
    #splitter::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 4px;
      background: transparent;
    }
    #splitter:hover::after,
    #splitter:focus-visible::after,
    #splitter.dragging::after {
      background: var(--vscode-focusBorder, #007fd4);
    }
    /* Canvas overlay sits above the rows (branch curves), never intercepts input. */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--graph-width, 240px);
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="toolbar" role="toolbar" aria-label="Network operations">
      <button id="btn-fetch" class="net-btn" type="button" title="Fetch from all remotes" aria-label="Fetch from all remotes">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.46-3.54"/><path d="M9.1 3.8 11.54 4.46 10.9 2.05"/></svg>
      </button>
      <button id="btn-pull" class="net-btn" type="button" title="Pull" aria-label="Pull">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.75v4.5"/><path d="M4.75 7.25 8 10.5 11.25 7.25"/><path d="M3.25 13.25h9.5"/></svg>
      </button>
      <button id="btn-push" class="net-btn" type="button" title="Push" aria-label="Push">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.25V7.75"/><path d="M4.75 7.75 8 4.5 11.25 7.75"/><path d="M3.25 13.25h9.5"/></svg>
      </button>
      <button id="btn-sync" class="net-btn" type="button" title="Sync (pull, then push)" aria-label="Sync (pull, then push)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.25 12.75V6.75"/><path d="M2.75 6.75 5.25 4.25 7.75 6.75"/><path d="M10.75 3.25v6"/><path d="M8.25 9.25 10.75 11.75 13.25 9.25"/></svg>
      </button>
      <button id="ahead-behind" type="button" title="" aria-label="Ahead and behind counts"></button>
    </div>
    <div id="graph-area">
      <div id="scroller">
        <div id="spacer"></div>
        <div id="rows"></div>
      </div>
      <canvas id="overlay"></canvas>
      <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Commit graph lane area width" tabindex="0"></div>
    </div>
  </div>
  <script type="module" src="./graph.js"></script>
</body>
</html>
