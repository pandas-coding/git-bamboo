<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Full-color marketplace icon source (media/icon.png is rasterized
       from this at 128x128; the PNG is committed, builds do not regenerate
       it).

       Brand mark "Merge Lane": a bamboo grove read as a git commit graph —
       one tall lane, one branch curving in (a merge), two bamboo joint
       bands, a single lime commit dot at the head. Deep forest-ink field,
       near-white bold geometry, one accent color. media/bamboo.svg is the
       monochrome 24x24 activity-bar version of the same composition.
       Alternates (monogram B, growth) live in media/design/ with
       preview.html.

       Rasterize with:  rsvg-convert -w 128 -h 128 media/bamboo-full.svg
                        -o media/icon.png
       (or: npx sharp-cli resize 128 128 -i media/bamboo-full.svg
            -o media/icon.png) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A4630"/>
      <stop offset="1" stop-color="#0C2A1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#8FE388" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8FE388" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="27" fill="url(#bg)"/>
  <rect width="128" height="128" rx="27" fill="url(#glow)"/>
  <g fill="none" stroke="#ECF5ED" stroke-linecap="round">
    <path d="M72 102 V44" stroke-width="13"/>
    <path d="M44 102 V88 C44 72 56 64 72 64" stroke-width="13"/>
    <path d="M60 54 H84" stroke-width="8"/>
    <path d="M60 90 H84" stroke-width="8"/>
  </g>
  <circle cx="72" cy="24" r="8.5" fill="#A3E635"/>
  <rect width="128" height="128" rx="27" fill="url(#sheen)"/>
</svg>
