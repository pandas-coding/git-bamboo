<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Git Bamboo activity bar icon: the monochrome 24x24 version of the
       "Merge Lane" brand mark (see media/bamboo-full.svg / icon.png) —
       one tall stalk, one branch merging into it, two bamboo joint bands,
       and a commit dot at the head. Single solid color, no baked opacity:
       VS Code recolors it per theme and applies its own
       default/hover/active opacity states. -->
  <g fill="none" stroke="#C8C8C8" stroke-linecap="round">
    <path d="M14.25 19.6 V8.7" stroke-width="2.4"/>
    <path d="M9 19.6 V16.9 C9 13.9 11.25 12.4 14.25 12.4" stroke-width="2.4"/>
    <path d="M12 10.5 H16.5" stroke-width="1.5"/>
    <path d="M12 17.3 H16.5" stroke-width="1.5"/>
  </g>
  <circle cx="14.25" cy="4.7" r="1.8" fill="#C8C8C8"/>
</svg>
