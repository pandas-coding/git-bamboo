[workspace]
members = ["crates/engine", "crates/protocol", "crates/xtask"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
authors = ["Git Bamboo Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# `blame` is already part of gix's default features (via `extras`), but it is
# named explicitly: getBlame calls `gix::blame::file` directly, so a future
# `default-features = false` trim must break the build here rather than
# silently drop blame support.
gix = { version = "0.87", features = ["blame"] }
redb = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
