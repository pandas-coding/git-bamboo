[workspace]
members = ["crates/engine", "crates/protocol", "crates/gix-adapt"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
authors = ["Git Workbench Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gix = "0.87"
redb = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-lsp = "0.20"
watchexec = "8.4"
watchexec-events = "6.1"
watchexec-signals = "5.1"
notify = "8"
thiserror = "2"
anyhow = "1"
dashmap = "6"
once_cell = "1"
async-trait = "0.1"
crossbeam-channel = "0.5"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
